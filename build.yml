name: Build NullGrid (32-bit)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REF: b8275403823239f6a3d6ee1b93e9db5be68d2a2b

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Get base source
        uses: actions/checkout@v6
        with:
          repository: ZalithLauncher/ZalithLauncher2
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive

      - name: Apply NullGrid changes
        run: |
          python3 - <<'PY'
          import pathlib, sys

          def swap(path, old, new):
              p = pathlib.Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  sys.exit(f"Patch failed in {path}: expected one match for {old!r}, found {text.count(old)}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          app = "ZalithLauncher/"
          src = app + "src/main/java/com/movtery/zalithlauncher/"

          # Own name (required by the base project's extra license terms)
          props = app + "gradle.properties"
          swap(props, "launcher_name=ZalithLauncher", "launcher_name=NullGrid")
          swap(props, "launcher_app_name=Zalith Launcher", "launcher_app_name=NullGrid")
          swap(props, "launcher_short_name=ZL2", "launcher_short_name=NG")

          # Own app ID, and sign the optimized build with the repo's debug key
          gradle = app + "build.gradle.kts"
          swap(gradle, "applicationId = zalithPackageName", 'applicationId = "io.github.nullgrid.launcher"')
          swap(gradle, 'applicationIdSuffix = ".v2"', "")
          swap(gradle, 'signingConfig = signingConfigs.getByName("releaseBuild")',
                       'signingConfig = signingConfigs.getByName("debugBuild")')

          # Required "unofficial" label on the main screen
          main = src + "ui/screens/main/MainScreen.kt"
          swap(main, "if (festivals.isEmpty()) {", "if (true) {")
          swap(main, "text = BuildKeys.LAUNCHER_IDENTIFIER,",
                     'text = "NullGrid · Unofficial Modified Version",')

          # Lighter defaults for a low-end 32-bit phone (all changeable in Settings)
          swap(src + "setting/RendererSettings.kt",
               'intSetting("resolutionRatio", 100, 25..300)', 'intSetting("resolutionRatio", 70, 25..300)')
          swap(src + "setting/RendererSettings.kt",
               'boolSetting("requestMaxRefreshRate", true)', 'boolSetting("requestMaxRefreshRate", false)')
          swap(src + "setting/LauncherSettings.kt",
               'boolSetting("launcherSwapAnimEnabled", true)', 'boolSetting("launcherSwapAnimEnabled", false)')
          print("All changes applied")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          curl -fsSL "https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*

      - name: Set up Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build 32-bit APK
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NullGrid-32bit-apk
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error
