name: Build Shizumi

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  # CHANGE THIS to the zip you uploaded, for each new version
  ZIP_NAME: shizumi-v0.1.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Unzip the app
        run: |
          echo "Files in repo:"
          ls -la
          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: $ZIP_NAME is not in the repo. Upload it to the repo root, or change ZIP_NAME at the top of this file."
            exit 1
          fi
          rm -rf shizumi
          unzip -q "$ZIP_NAME"
          echo "After unzip:"
          ls -la shizumi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build the APK
        working-directory: shizumi
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: Shizumi-apk
          path: shizumi/app/build/outputs/apk/debug/*.apk
