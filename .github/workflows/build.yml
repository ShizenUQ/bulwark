name: Build Shizumi
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the newest shizumi zip
        run: |
          z=$(ls shizumi-v*.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$z" ]; then rm -rf shizumi; unzip -q "$z"; fi
          ls shizumi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        run: cd shizumi && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Shizumi-debug-apk
          path: shizumi/app/build/outputs/apk/debug/*.apk
