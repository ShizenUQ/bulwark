name: Build Gloomveil

on:
  workflow_dispatch:

env:
  ZIP_NAME: gloomveil-v0.1.zip   # must match the zip file name in your repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check zip exists
        run: |
          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::$ZIP_NAME not found in the repo. Upload the zip and set ZIP_NAME in this file."
            ls -la
            exit 1
          fi

      - name: Unzip
        run: unzip -q "$ZIP_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        working-directory: gloomveil
        run: pip install -r requirements.txt

      - name: Setup shader compiler
        working-directory: gloomveil
        run: ./build.sh setup

      - name: Build shader pack (Android)
        working-directory: gloomveil
        run: ./build.sh pack -p android

      - name: Build sound pack (skipped if no .ogg files)
        working-directory: gloomveil
        run: python3 make_soundpack.py

      - uses: actions/upload-artifact@v4
        with:
          name: Gloomveil
          path: |
            gloomveil/build/*.mcpack
