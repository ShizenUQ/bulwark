name: Build NullGrid (32-bit)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Get this repository
        uses: actions/checkout@v6
        with:
          path: recipe

      - name: Unzip NullGrid.zip
        run: |
          if [ ! -f recipe/NullGrid.zip ]; then
            echo "::error::NullGrid.zip not found. Upload it to the top level of the repository with this exact name."
            ls -la recipe
            exit 1
          fi
          unzip -o recipe/NullGrid.zip -d "$RUNNER_TEMP/nullgrid"
          echo "UPSTREAM_REF=$(cat "$RUNNER_TEMP/nullgrid/upstream.txt")" >> "$GITHUB_ENV"

      - name: Get base source
        uses: actions/checkout@v6
        with:
          repository: ZalithLauncher/ZalithLauncher2
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive
          path: src

      - name: Apply NullGrid changes
        working-directory: src
        run: python3 "$RUNNER_TEMP/nullgrid/patch.py"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          curl -fsSL "https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*

      - name: Set up Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build 32-bit APK
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NullGrid-32bit-apk
          path: src/ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error
